[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "a3-research-agent"
version = "0.1.0"
description = "A self-evolving research agent for the A3 dual-arm simulation project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mini-swe-agent==2.4.6",
    "litellm[mcp]==1.106.6",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pillow==13.0.0",
]

[dependency-groups]
dev = ["mini-swe-agent[dev]==2.4.6", "setuptools>=75"]

[tool.uv.sources]
mini-swe-agent = {path = "third_party/mini-swe-agent", editable = true}

[tool.setuptools.packages.find]
where = ["src"]
include = ["a3_research_agent*"]

[tool.setuptools.package-data]
"a3_research_agent.execution.controller" = ["nvidia_egl_vendor.json"]
"a3_research_agent.execution.images" = ["Dockerfile"]

[project.scripts]
a3-research = "a3_research_agent.cli.launch:main"
a3-research-controller = "a3_research_agent.execution.controller.cli:run"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["third_party", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
